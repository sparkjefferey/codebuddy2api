name: build-release

# 推送 v* tag 自动构建 Tauri 多平台安装包并发布 GitHub Release。
# workflow_dispatch 可在分支上手动跑以先验证构建(不创建 Release)。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # ============ Windows x64 ============
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install frontend deps && build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          args: --bundles msi,nsis
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  # ============ macOS Apple Silicon ============
  mac-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install frontend deps && build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Setup macOS signing env (only when secrets present)
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          DEV_ID: ${{ secrets.DEV_ID }}
          APPLE_NOTARIZE_API_KEY_ID: ${{ secrets.APPLE_NOTARIZE_API_KEY_ID }}
          APPLE_NOTARIZE_API_KEY: ${{ secrets.APPLE_NOTARIZE_API_KEY }}
          APPLE_NOTARIZE_TEAM_ID: ${{ secrets.APPLE_NOTARIZE_TEAM_ID }}
        run: |
          # tauri-cli 会把空字符串的 APPLE_CERTIFICATE 当作已配置并尝试导入证书，
          # 因此只在 secret 非空时注入签名变量，否则产出未签名包
          if [ -n "$MACOS_CERT_P12" ]; then
            echo "APPLE_CERTIFICATE=$MACOS_CERT_P12" >> "$GITHUB_ENV"
            echo "APPLE_CERTIFICATE_PASSWORD=$MACOS_CERT_PASSWORD" >> "$GITHUB_ENV"
            echo "APPLE_SIGNING_IDENTITY=$DEV_ID" >> "$GITHUB_ENV"
            echo "APPLE_ID=$APPLE_NOTARIZE_API_KEY_ID" >> "$GITHUB_ENV"
            echo "APPLE_PASSWORD=$APPLE_NOTARIZE_API_KEY" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=$APPLE_NOTARIZE_TEAM_ID" >> "$GITHUB_ENV"
          else
            echo "未配置签名 secrets，产出未签名包"
          fi
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          args: --target aarch64-apple-darwin
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-arm64
          if-no-files-found: error
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz

  # ============ macOS Intel ============
  mac-x86_64:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install frontend deps && build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Setup macOS signing env (only when secrets present)
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          DEV_ID: ${{ secrets.DEV_ID }}
          APPLE_NOTARIZE_API_KEY_ID: ${{ secrets.APPLE_NOTARIZE_API_KEY_ID }}
          APPLE_NOTARIZE_API_KEY: ${{ secrets.APPLE_NOTARIZE_API_KEY }}
          APPLE_NOTARIZE_TEAM_ID: ${{ secrets.APPLE_NOTARIZE_TEAM_ID }}
        run: |
          if [ -n "$MACOS_CERT_P12" ]; then
            echo "APPLE_CERTIFICATE=$MACOS_CERT_P12" >> "$GITHUB_ENV"
            echo "APPLE_CERTIFICATE_PASSWORD=$MACOS_CERT_PASSWORD" >> "$GITHUB_ENV"
            echo "APPLE_SIGNING_IDENTITY=$DEV_ID" >> "$GITHUB_ENV"
            echo "APPLE_ID=$APPLE_NOTARIZE_API_KEY_ID" >> "$GITHUB_ENV"
            echo "APPLE_PASSWORD=$APPLE_NOTARIZE_API_KEY" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=$APPLE_NOTARIZE_TEAM_ID" >> "$GITHUB_ENV"
          else
            echo "未配置签名 secrets，产出未签名包"
          fi
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          args: --target x86_64-apple-darwin
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-x86_64
          if-no-files-found: error
          path: |
            src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz

  # ============ Linux x86_64 ============
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - name: Install frontend deps && build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          args: --bundles deb,appimage
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

  # ============ 汇总发布(仅 tag) ============
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, mac-arm64, mac-x86_64, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "BuddyAIGateway ${{ github.ref_name }}"
          generate_release_notes: true
          fail_on_unmatched_files: false
          # 产物下载后按平台子目录展开（msi/nsis/dmg/macos/deb/appimage），
          # 必须用 ** 递归匹配，只查一层会静默发布空 Release
          files: |
            dist/**/*.msi
            dist/**/*.exe
            dist/**/*.dmg
            dist/**/*.deb
            dist/**/*.AppImage